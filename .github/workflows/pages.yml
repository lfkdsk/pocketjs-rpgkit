name: Pages

# Build the browser-playable examples (`bun run web`) and publish dist/web
# to GitHub Pages at https://lfkdsk.github.io/pocketjs-rpgkit/. The
# repository's Pages source must be set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time. A newer run queues behind one in flight
# instead of cancelling it halfway through a deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      # The wasm core (vendor/pocketjs/hosts/web/pocketjs.wasm) is a build
      # artifact, not a checked-in file. Stable Rust is enough.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache the wasm core build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/pocketjs/engine/wasm/target
          key: ${{ runner.os }}-pocketjs-wasm-${{ hashFiles('vendor/pocketjs/engine/wasm/Cargo.lock', 'vendor/pocketjs/engine/wasm/Cargo.toml', 'vendor/pocketjs/engine/core/Cargo.toml', 'vendor/pocketjs/engine/wasm/src/**', 'vendor/pocketjs/engine/core/src/**') }}
          restore-keys: ${{ runner.os }}-pocketjs-wasm-

      # vendor/pocketjs is a workspace of this package, so one install
      # covers its build dependencies too.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the wasm core
        run: bun run build:wasm

      - name: Build the site
        run: bun run web

      # Serves dist/web at / and under /pocket-rpgkit/, plays every game in
      # headless Chrome, and fails on a console error or a failed request.
      - name: Play the site in headless Chrome
        run: bun tools/web-verify.ts

      - name: Keep the verification screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-verify
          path: dist/web-verify/*.png
          retention-days: 7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
